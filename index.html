<!DOCTYPE html>
<html lang="bn" dir="ltr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0b1f33">
<title>JAMIA NAGAR</title>
<meta name="description" content="Connecting the Students of Jamia.">
<link rel="icon" href="assets/logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Noto+Naskh+Arabic:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>

<header class="topbar glass">
  <a class="brand" href="#home">
    <img src="assets/logo.jpg" alt="" width="40" height="40">
    <span data-i18n="site_name"></span>
  </a>
  <nav class="topnav" aria-label="Main">
    <span class="bism" data-i18n="bismillah"></span>
    <a href="#home" data-nav="home" data-i18n="nav_home"></a>
    <a href="#contacts" data-nav="contacts" data-i18n="nav_contacts"></a>
    <a href="#books" data-nav="books" data-i18n="nav_books"></a>
  </nav>
  <button class="lang-btn" id="langBtn" type="button" aria-label="Language"></button>
</header>

<main class="container">

  <!-- ============ PAGE 1 : HOME ============ -->
  <section id="page-home" class="page" data-page="home">
    <div class="hero glass">
      <img class="hero__logo" id="heroLogo" src="assets/logo.jpg" alt="Jamia logo" width="150" height="150">
      <h1 class="hero__title" data-i18n="site_name"></h1>
      <p class="inst-ar" id="nameAr" lang="ur" dir="rtl"></p>
      <p class="inst-bn" id="nameBn"></p>
      <p class="inst-addr" id="addrBn"></p>

      <div class="login glass" id="loginCard">
        <form id="loginForm" autocomplete="off" novalidate>
          <h2 data-i18n="login_title"></h2>
          <div class="field">
            <input id="codeInput" name="jn-access" type="text" class="masked" inputmode="numeric" pattern="[0-9]*" maxlength="4" autocapitalize="off" spellcheck="false" data-lpignore="true" data-1p-ignore data-form-type="other"
                   autocomplete="off" data-i18n-ph="login_ph" aria-describedby="loginMsg">
            <button type="button" class="eye" id="eyeBtn" aria-pressed="false">
              <svg id="eyeOpen" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg id="eyeShut" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M17.9 17.9A10.9 10.9 0 0 1 12 19C5 19 1 12 1 12a18.5 18.5 0 0 1 5.1-5.9M9.9 5.1A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a18.6 18.6 0 0 1-2.2 3.2M1 1l22 22"/><path d="M14.1 14.1A3 3 0 1 1 9.9 9.9"/></svg>
            </button>
          </div>
          <p class="msg" id="loginMsg" role="alert"></p>
          <button class="btn btn--glass" type="submit" data-i18n="login_btn"></button>
        </form>
        <div class="welcome" id="welcomeBox" hidden>
          <p data-i18n="welcome"></p>
          <div class="row">
            <button class="btn btn--glass" type="button" data-go="nigran" data-i18n="go_nigran"></button>
            <button class="btn btn--glass" type="button" data-go="staff" data-i18n="go_staff"></button>
          </div>
          <button class="link-btn" id="logoutBtn" type="button" data-i18n="logout"></button>
        </div>
      </div>
    </div>

    <article class="glass block">
      <div class="block__head">
        <h2 data-i18n="history_title"></h2>
        <button class="btn btn--small" id="scrollToggle" type="button"></button>
      </div>
      <div class="reader" id="historyReader" tabindex="0">
        <div id="historyText"></div>
      </div>
    </article>

    <article class="glass block">
      <h2 data-i18n="edu_title"></h2>
      <div id="eduText" class="prose"></div>
      <h3 data-i18n="subjects_title"></h3>
      <ul class="subjects" id="subjectList"></ul>
    </article>

    <footer class="footer">
      <p><span data-i18n="email_label"></span>: <a id="mailLink" href="#"></a></p>
    </footer>
  </section>

  <!-- ============ PAGE 2 : CONTACTS ============ -->
  <section id="page-contacts" class="page" data-page="contacts" hidden>
    <div class="marquee glass" role="note">
      <div class="marquee__track"><span class="notice"></span><span class="notice" aria-hidden="true"></span></div>
    </div>

    <div id="cChoice" class="choice-grid">
      <button class="choice glass" type="button" data-open="staff">
        <span class="choice__icon">👥</span>
        <span class="choice__text" data-i18n="opt1"></span>
        <span class="choice__count" id="staffCount"></span>
      </button>
      <button class="choice glass" type="button" data-open="nigran">
        <span class="choice__icon">🧭</span>
        <span class="choice__text" data-i18n="opt2"></span>
        <span class="choice__count" id="nigranCount"></span>
      </button>
    </div>

    <div id="cDir" hidden>
      <button class="btn btn--ghost btn--small" id="cBack" type="button"><span class="flip">‹</span> <span data-i18n="back"></span></button>
      <h2 id="cTitle" class="dir-title"></h2>
      <div class="searchbar glass">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
        <input id="cSearch" type="search" data-i18n-ph="search_ph" autocomplete="off">
        <button class="clear" id="cClear" type="button" data-i18n="clear" hidden></button>
      </div>
      <div class="chips" id="cChips"></div>
      <div class="countrow"><p class="count" id="cCount" aria-live="polite"></p><button class="btn btn--ghost btn--small" id="cToggleAll" type="button" hidden></button></div>
      <div id="cList"></div>
    </div>
  </section>

  <!-- ============ PAGE 3 : BOOKS ============ -->
  <section id="page-books" class="page" data-page="books" hidden>
    <header class="page-head">
      <h2 data-i18n="books_title"></h2>
    </header>
    <div class="searchbar glass">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
      <input id="bSearch" type="search" data-i18n-ph="books_search_ph" autocomplete="off">
      <button class="clear" id="bClear" type="button" data-i18n="clear" hidden></button>
    </div>
    <p class="count" id="bCount" aria-live="polite"></p>
    <div id="bList"></div>
  </section>
</main>

<nav class="bottomnav glass" aria-label="Main">
  <span class="bism" data-i18n="bismillah"></span>
  <a href="#home" data-nav="home">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l9-8 9 8v10a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    <span data-i18n="nav_home"></span></a>
  <a href="#contacts" data-nav="contacts">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1 1 .4 1.9.7 2.8a2 2 0 0 1-.5 2.1L8.1 9.9a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.8.7a2 2 0 0 1 1.7 2z"/></svg>
    <span data-i18n="nav_contacts"></span></a>
  <a href="#books" data-nav="books">
    <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg>
    <span data-i18n="nav_books"></span></a>
</nav>

<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script src="js/config.js"></script>
<script src="js/i18n.js"></script>
<script src="js/history.js"></script>
<script src="js/contacts.js"></script>
<script src="js/nigran.js"></script>
<script src="js/books.js"></script>
<script src="js/app.js"></script>
</body>
</html>
